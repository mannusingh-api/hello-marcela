#upd.on{display:block;animation:updin .28s ease-out}@keyframes updin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#upd.on{animation:none}}
#upd button{font:inherit;border:0}#upd .ur{display:flex;align-items:center;gap:10px}
#upd .ui{width:36px;height:36px;border-radius:50%;background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;flex:none}
#upd .ut{flex:1;line-height:1.25}#upd .ut b{display:block;font-weight:600;font-size:1rem}#upd .ut small{display:block;font-size:.8rem;color:#c9c9c9}
#upd .ub{display:flex;gap:8px;align-items:center;margin-top:10px}
#upd .ug{flex:1.6;border-radius:12px;background:#14a8a0;color:#04201e;font-weight:800;min-height:48px;padding:0 14px}
#upd .ul{flex:1;background:none;color:#c9c9c9;font-weight:600;font-size:.85rem;line-height:1.2;min-height:48px;padding:0 6px}</style>

mo?"],["Can I pay you on Cash App?","¿Le puedo pagar por Cash App?"],["I'd like to send money to my family.","Quisiera enviar dinero a mi familia."],["How much is the transfer fee?","¿Cuánto cuesta la comisión de la transferencia?"],["How long will the transfer take?","¿Cuánto tarda la transferencia?"],["I received the money.","Recibí el dinero."],["The payment is pending.","El pago está pendiente."],["Did you get my payment?","¿Recibió mi pago?"]]],["Bills and rent / Cuentas y renta",["shopper","bank"],[["When is the bill due?","¿Cuándo vence la cuenta?"],["I need to pay my electric bill.","Necesito pagar mi cuenta de luz."],["How much is the water bill?","¿Cuánto es la cuenta del agua?"],["There is a late fee.","Hay un cargo por pago tardío."],["Can I pay in two parts?","¿Puedo pagar en dos partes?"],["Can I set up automatic payments?","¿Puedo configurar pagos automáticos?"],["I paid the bill online.","Pagué la cuenta en línea."],["Please send me a copy of the bill.","Por favor, envíeme una copia de la cuenta."],["I'd like a payment plan.","Quisiera un plan de pagos."]]],["Getting paid at work / Recibir el pago del trabajo",["work"],[["Is my pay by check or direct deposit?","¿Mi pago es con cheque o depósito directo?"],["I'd like direct deposit.","Quisiera depósito directo."],["Here is my bank account information.","Aquí está la información de mi cuenta bancaria."],["Where do I cash this check?","¿Dónde cobro este cheque?"],["Is there a fee to cash a check?","¿Hay una cuota por cobrar un cheque?"],["I need to see my pay stub.","Necesito ver mi comprobante de pago."],["My check is less than I expected.","Mi cheque es menos de lo que esperaba."],["What is this deduction?","¿Qué es esta deducción?"],["How many hours did you pay?","¿Cuántas horas pagaron?"],["Please check my hours again.","Por favor, revise mis horas otra vez."]]],["Overtime and rates / Horas extra y tarifas",["work"],[["How much is the hourly rate?","¿Cuánto es la tarifa por hora?"],["I'm paid fifteen dollars an hour.","Me pagan quince dólares la hora."],["I worked overtime this week.","Trabajé horas extra esta semana."],["Overtime pays more.","Las horas extra se pagan más."],["I'm paid by the day.","Me pagan por día."],["I get paid every two weeks.","Me pagan cada dos semanas."],["Are the taxes taken out?","¿Ya descontaron los impuestos?"],["I need a form for my taxes.","Necesito un formulario para mis impuestos."],["Can I get a copy of my hours?","¿Me da una copia de mis horas?"],["Please pay me for the extra day.","Por favor, pague el día extra."]]]],"car":[["At the gas pump / En la bomba de gasolina",["driver"],[["Pay at the pump or inside?","¿Pago en la bomba o adentro?"],["Pump number three, please.","La bomba número tres, por favor."],["Regular, please.","Regular, por favor."],["Twenty dollars on pump four.","Veinte dólares en la bomba cuatro."],["The pump won't start.","La bomba no arranca."],["My card isn't working at the pump.","Mi tarjeta no funciona en la bomba."],["Where is the air for the tires?","¿Dónde está el aire para las llantas?"],["Where is the car wash?","¿Dónde está el autolavado?"]]],["Car trouble / Problemas del carro",["driver","staff"],[["My car won't start.","Mi carro no arranca."],["The engine is making a noise.","El motor hace un ruido."],["The check engine light is on.","Se prendió la luz de revisar el motor."],["The brakes are squeaking.","Los frenos rechinan."],["The car is overheating.","El carro se está sobrecalentando."],["I ran out of gas.","Me quedé sin gasolina."],["I need a tow truck.","Necesito una grúa."],["Can you jump-start my car?","¿Me puede pasar corriente?"]]],["At the repair shop / En el taller",["driver","staff"],[["Can you look at my car?","¿Puede revisar mi carro?"],["What seems to be the problem?","¿Cuál parece ser el problema?"],["How long will the repair take?","¿Cuánto tardará la reparación?"],["Can I get an estimate first?","¿Me puede dar un presupuesto primero?"],["It needs a new battery.","Necesita una ez."],["I've been waiting for an hour.","He esperado una hora."],["Next, please.","El siguiente, por favor."]]],["Forms and paperwork / Formularios y papeles",["visitor","clerk"],[["I need this form.","Necesito este formulario."],["Do you have this form in Spanish?","¿Tiene este formulario en español?"],["Please fill out this form.","Por favor, llene este formulario."],["Use blue or black ink.","Use tinta azul o negra."],["Print your name here.","Escriba su nombre aquí con letra de molde."],["Sign at the bottom.","Firme abajo."],["What does this line mean?","¿Qué significa esta línea?"],["Can you help me fill it out?","¿Me puede ayudar a llenarlo?"],["I made a mistake on the form.","Me equivoqué en el formulario."],["Can I get another copy?","¿Me da otra copia?"]]],["Documents and ID / Documentos e identificación",["visitor","clerk"],[["Do you have a photo ID?","¿Tiene una identificación con foto?"],["I need to see your documents.","Necesito ver sus documentos."],["I need proof of address.","Necesito comprobante de domicilio."],["A utility bill works.","Sirve un recibo de luz o agua."],["Do you have your birth certificate?","¿Tiene su acta de nacimiento?"],["I need a certified copy.","Necesito una copia certificada."],["Bring the original, not a copy.","Traiga el original, no una copia."],["I forgot a document.","Olvidé un documento."],["Can I bring it tomorrow?","¿Puedo traerlo mañana?"],["Your document has expired.","Su documento venció."]]],["Fees and payments / Cuotas y pagos",["visitor","clerk"],[["How much is the fee?","¿Cuánto es la cuota?"],["You can pay at the window.","Puede pagar en la ventanilla."],["We accept cash or card.","Aceptamos efectivo o tarjeta."],["We don't take personal checks.","No aceptamos cheques personales."],["Do you give a receipt?","¿Dan recibo?"],["Keep this receipt.","Guarde este recibo."],["Can I pay online?","¿Puedo pagar en línea?"],["The fee is non-refundable.","La cuota no es reembolsable."],["Is there a fee for this?","¿Hay que pagar por esto?"],["Pay at the cashier's window.","Pague en la caja."]]],["At the DMV / En el DMV",["visitor","clerk"],[["I need to renew my driver's license.","Necesito renovar mi licencia de conducir."],["I'd like to get a state ID.","Quisiera sacar una identificación estatal."],["I need to take the written test.","Necesito hacer el examen escrito."],["Is the test available in Spanish?","¿El examen está disponible en español?"],["Look into the camera.","Mire a la cámara."],["Take off your glasses.","Quítese los lentes."],["You need to pass the vision test.","Tiene que aprobar la prueba de la vista."],["You passed the test.","Aprobó el examen."],["You didn't pass, you can try again.","No aprobó, puede intentarlo otra vez."],["Your new license will arrive by mail.","Su nueva licencia llegará por correo."]]],["At the post office / En la oficina de correos",["visitor","clerk"],[["I want to send a package to Mexico.","Quiero enviar un paquete a México."],["Do you want it to be tracked?","¿Quiere que tenga rastreo?"],["How long will it take to arrive?","¿Cuánto tardará en llegar?"],["Do you have stamps?","¿Tiene estampillas?"],["I need a book of stamps.","Necesito un librito de estampillas."],["Is there anything dangerous inside?","¿Hay algo peligroso adentro?"],["I'd like to pick up a package.","Quisiera recoger un paquete."],["Here is my notice slip.","Aquí está mi aviso."]]],["At the library / En la biblioteca",["visitor","clerk"],[["I'd like a library card.","Quisiera una tarjeta de la biblioteca."],["Do you have books in Spanish?","¿Tienen libros en español?"],["How long can I keep the book?","¿Cuánto tiempo puedo quedarme con el libro?"],["The book is due on Friday.","El libro vence el viernes."],["Can I renew this book?","¿Puedo renovar este libro?"],["Do you have free computers?","¿Tienen computadoras gratis?"],["Where is the children's section?","¿Dónde está la sección infantil?"],["Please be quiet in the library.","Por favor, guarde silencio en la biblioteca."],["I returned the book.","Devolví el libro."],["Is there a class for learning English?","¿Hay una clase para aprender inglés?"]]],["Asking for help and an interpreter / Pedir ayuda e intérprete",["visitor","clerk"],[["Do you have an interpreter?","¿Tienen un intérprete?"],["Can someone help me in Spanish?","¿Alguien me puede ayudar en español?"],["I don't understand this letter.","No entiendo esta carta."],["Can you explain this to me?","¿Me puede explicar esto?"],["Which office handles this?","¿Qué oficina se encarga de esto?"],["Can you give me the phone number?","¿Me puede dar el número de teléfono?"],["Can you write down the address?","¿Puede anotar la dirección?"],["What are your office hours?","¿Cuál es su horario de atención?"],["Is this office open on Saturday?","¿Esta oficina abre los sábados?"]]]],"landlord":[["Reporting a problem / Reportar un problema",["tenant","landlord"],[["I need to report a problem.","Necesito reportar un problema."],["Something is broken in my apartment.","Algo está roto en mi apartamento."],["When can someone come to fix it?","¿Cuándo puede venir alguien a arreglarlo?"],["Please send someone today.","Por favor, mande a alguien hoy."],["I called last week.","Llamé la semana pasada."],["Nobody has come yet.","Todavía no ha venido nadie."],["Can you put the request in writing?","¿Puede dejar la solicitud por escrito?"],["I'll send you a photo of the damage.","Le mando una foto del daño."],["The maintenance worker will come tomorrow.","El de mantenimiento vendrá mañana."],["Is it okay if he comes in?","¿Está bien si él entra?"]]],["Water and plumbing / Agua y plomería",["tenant","landlord"],[["The faucet is leaking.","La llave gotea."],["The sink is clogged.","El fregadero está tapado."],["The toilet won't flush.","El inodoro no baja."],["There is no hot water.","No hay agua caliente."],["There is a leak in the ceiling.","Hay una gotera en el techo."],["The pipe burst.","Se reventó el tubo."],["The water pressure is low.","La presión del agua es baja."],["There is water on the floor.","Hay agua en el piso."],["Turn off the water valve.","Cierre la llave de paso del agua."],["The shower drain is slow.","El desagüe de la regadera está lento."]]],["Heat, air and electricity / Calefacción, aire y electricidad",["tenant","landlord"],[["The heater isn't working.","La calefacción no funciona."],["The air conditioning is broken.","El aire acondicionado está descompuesto."],["It's freezing in the apartment.","Hace un frío helado en el apartamento."],["The power went out.","Se fue la luz."],["The outlet doesn't work.","El enchufe no funciona."],["The light bulb burned out.","Se fundió el foco."],["The breaker keeps tripping.","El interruptor sigue saltando."],["Where is the breaker box?","¿Dónde está la caja de interruptores?"],["The smoke detector is beeping.","El detector de humo está pitando."],["I need a new battery for the alarm.","Necesito una pila nueva para la alarma."]]],["Pests and mold / Plagas y moho",["tenant","landlord"],[["There are cockroaches in the kitchen.","Hay cucarachas en la cocina."],["I saw a mouse.","Vi un ratón."],["We have ants.","Tenemos hormigas."],["I need pest control.","Necesito control de plagas."],["When is the exterminator coming?","¿Cuándo viene el exterminador?"],["There is mold in the bathroom.","Hay moho en el baño."],["The wall has a damp spot.","La pared tiene una mancha de humedad."],["The smell is getting worse.","El olor está empeorando."],["It's not safe for my kids.","No es seguro para mis hijos."],["Please fix it as soon as possible.","Por favor, arréglelo lo antes posible."]]],["Doors, locks and keys / Puertas, cerraduras y llaves",["tenant","landlord"],[["I'm locked out.","Me quedé afuera."],["I lost my key.","Perdí mi llave."],["I need a copy of the key.","Necesito una copia de la llave."],["Can you change the lock?","¿Puede cambiar la cerradura?"],["The door won't close.","La puerta no cierra."],["The window won't open.","La ventana no abre."],["The lock is broken.","La cerradura está rota."],["Who has a spare key?","¿Quién tiene una llave de repuesto?"],["There's a fee to replace the key.","Hay un cargo por reponer la llave."],["Please give me the gate code.","Por favor, deme el código del portón."]]],["Rent and the lease / Renta y contrato",["tenant","landlord"],[["When is the rent due?","¿Cuándo vence la renta?"],["Is the deposit refundable?","¿El depósito es reembolsable?"],["I'd like to read the lease first.","Quisiera leer primero el contrato."],["Please explain this part of the lease.","Por favor, explíqueme esta parte del contrato."],["How long is the lease?","¿De cuánto tiempo es el contrato?"],["Can I pay the rent late this month?","¿Puedo pagar la renta tarde este mes?"],["Is rent going up next year?","¿La renta va a subir el próximo año?"],["I'd like a receipt for the rent.","Quisiera un recibo de la renta."],["Is water included in the rent?","¿El agua está incluida en la renta?"]]],["Neighbors and noise / Vecinos y ruido",["tenant","landlord"],[["The neighbors are too loud.","Los vecinos hacen mucho ruido."],["Please keep the noise down.","Por favor, baje el ruido."],["There is a party upstairs.","Hay una fiesta arriba."],["I can't sleep because of the noise.","No puedo dormir por el ruido."],["Someone parked in my spot.","Alguien se estacionó en mi lugar."],["Where do I put the trash?","¿Dónde pongo la basura?"],["When is trash pickup?","¿Cuándo pasa la basura?"],["The hallway light is out.","La luz del pasillo no funciona."],["The elevator is broken.","El elevador está descompuesto."],["Are pets allowed?","¿Se permiten mascotas?"]]],["Moving in and out / Mudarse y dejar el apartamento",["tenant","landlord"],[["I'd like to see the apartment.","Quisiera ver el apartamento."],["Is the apartment furnished?","¿El apartamento está amueblado?"],["I'm moving out at the end of the month.","Me mudo a fin de mes."],["I'll give you thirty days' notice.","Le aviso con treinta días."],["Please inspect the apart
